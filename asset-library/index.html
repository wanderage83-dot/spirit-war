<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>사신전기 · 아트 라이브러리</title>
<style>
:root{color-scheme:dark;--bg:#121b1d;--panel:#1c292c;--line:#34484b;--ink:#eef3eb;--muted:#acbfba;--accent:#bce0b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}header,main{max-width:1440px;margin:auto;padding:28px}header{padding-bottom:18px}small,.sub{color:var(--muted)}h1{font:600 clamp(26px,4vw,40px)/1.3 Georgia,serif;letter-spacing:-.04em;margin:5px 0 12px}p{margin:5px 0}a{color:var(--accent)}button,input,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 12px}button,a{touch-action:manipulation}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px 0}.toolbar input{flex:1 1 260px;min-width:0}.categories{display:flex;flex-wrap:wrap;gap:7px}.categories button{font-size:13px;padding:6px 10px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:24px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);min-width:0}.preview{display:flex;align-items:center;justify-content:center;width:100%;height:185px;border:0;border-radius:0;background-color:#d9ded8;background-image:conic-gradient(#c0c9c5 25%,transparent 0 50%,#c0c9c5 0 75%,transparent 0);background-size:20px 20px;padding:12px}.dark-check .preview,.dark-check .large{background-color:#273137;background-image:conic-gradient(#354349 25%,transparent 0 50%,#354349 0 75%,transparent 0)}.preview img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px #0002)}.pixel{image-rendering:pixelated}.info{padding:12px}.info h2{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path{font:11px/1.5 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere;margin:5px 0;min-height:33px}.meta{font-size:12px;color:var(--muted)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;border-radius:4px;padding:1px 5px;background:#344543}.actions{display:flex;gap:8px;margin-top:10px;align-items:center}.actions a,.actions button{font-size:12px}.actions button{padding:4px 7px}.more{display:block;margin:24px auto}.empty{padding:60px 15px;text-align:center;color:var(--muted)}dialog{width:min(960px,94vw);max-height:93dvh;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--bg);color:var(--ink);overflow:auto}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}dialog h2{margin:0}.large{height:43dvh;min-height:180px;margin:16px 0;display:flex;justify-content:center;align-items:center;padding:12px;background-color:#d9ded8;background-image:conic-gradient(#c0c9c5 25%,transparent 0 50%,#c0c9c5 0 75%,transparent 0);background-size:20px 20px}.large img{max-width:100%;max-height:100%;object-fit:contain}.large.repeat{background-repeat:repeat;background-size:256px 256px}.large.repeat img{display:none}dl{display:grid;grid-template-columns:100px 1fr;gap:4px 12px;font-size:13px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.note{color:#dcd4af;font-size:13px}.status{min-height:24px;color:var(--accent);font-size:13px}.footer{padding:28px 0;color:var(--muted);font-size:13px}#data-error{color:#ffc5a8} @media(max-width:550px){header,main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.preview{height:145px;padding:8px}.info{padding:9px}.info h2{font-size:13px}.bar{align-items:flex-start}.categories{flex-wrap:nowrap;overflow:auto;padding-bottom:8px}.categories button{flex-shrink:0}.actions{flex-wrap:wrap}dialog{padding:14px}dl{grid-template-columns:80px 1fr}.path{font-size:10px}}
[hidden]{display:none!important}.overview #grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.overview .preview{height:110px;padding:6px}.overview .info{padding:6px}.overview .info h2{font-size:12px}.overview .path{font-size:10px;min-height:0;margin:3px 0 0}.overview .meta,.overview .tags,.overview .card .actions{display:none}.overview .card{border-radius:7px}.view-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:550px){.overview #grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.overview .preview{height:90px}.overview .info{padding:5px}.overview .info h2{font-size:11px}}
</style>
<header>
 <small>SPIRIT WAR / ART ARCHIVE</small><h1>사신전기 아트 라이브러리</h1>
 <p class="sub">찾고, 살펴보고, 다른 작업에 다시 쓰는 그림 보관함.</p>
 <p id="summary" class="sub"></p><p id="data-error" hidden>목록 파일이 없습니다. 저장소에서 python3 tools/asset-library.py build 를 실행하세요.</p>
 <div class="toolbar"><input id="search" type="search" placeholder="이름·파일명·병종 검색 · 예: 무진, 기병, canopy" aria-label="에셋 검색"><select id="scope" aria-label="그림 묶음"><option value="recent">최근 제작 묶음</option><option value="all">모든 게임 그림</option></select><select id="direction" aria-label="방향 필터"><option value="">모든 방향</option><option value="fr">앞 오른쪽</option><option value="fl">앞 왼쪽</option><option value="br">뒤 오른쪽</option><option value="bl">뒤 왼쪽</option></select><button id="background" aria-pressed="false">어두운 배경</button></div>
 <nav class="categories" id="categories" aria-label="그림 종류"></nav>
</header>
<main>
 <div class="bar"><p id="count"></p><div class="view-controls"><button id="overview" aria-pressed="false">전체 펼쳐보기</button><button id="export-list">검색 결과 목록 저장</button></div></div><div class="status" id="status" role="status"></div>
 <div class="grid" id="grid"></div><button class="more" id="more">더 보기</button>
 <div class="footer">그림 경로와 게임 파일은 원래 위치를 유지합니다. PNG 전달본·WebP 게임용 파일·걷기 프레임을 함께 수록했습니다. <a href="README.md">사용·ZIP 만들기</a> · <a href="catalog.json" download>전체 메타데이터 JSON</a> · <a href="../ART_REQUESTS.md">제작 프롬프트·요청 기록</a></div>
</main>
<dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title"></h2><p class="sub" id="detail-category"></p></div><button id="close" aria-label="상세 닫기">닫기 ×</button></div><div class="large" id="large"><img id="large-image" alt=""></div><button id="repeat" hidden aria-pressed="false">바닥 타일 반복 보기</button><dl id="details"></dl><p class="note" id="note"></p><div class="actions"><a id="download" download>원본 파일 받기</a><button id="copy">경로 복사</button><a id="doc">크기·기준점·사용 문서</a></div><p class="status" id="dialog-status" role="status"></p></dialog>
<script src="catalog.js"></script>
<script>
'use strict';
const D=window.ASSET_LIBRARY,$=s=>document.querySelector(s);let category='',filtered=[],shown=0,selected=null,overview=false;
if(!D){$('#data-error').hidden=false;$('#more').hidden=true}else{init()}
function url(path){return '../'+path.split('/').map(encodeURIComponent).join('/')}
function size(bytes){return bytes<1024?bytes+' B':bytes<1048576?(bytes/1024).toFixed(1)+' KB':(bytes/1048576).toFixed(1)+' MB'}
function init(){const recent=D.assets.filter(a=>a.recent).length;$('#summary').textContent=`${D.image_count.toLocaleString()}개 파일 · ${size(D.total_bytes)} · 최근 제작 지형·천하도·망자군 ${recent}개`;
 const add=(id,title)=>{const b=document.createElement('button');b.textContent=title;b.dataset.category=id;b.onclick=()=>{category=id;if(id&&!['hd','world','undead'].includes(id))$('#scope').value='all';refresh()};$('#categories').append(b)};add('','전체 종류');for(const[id,name]of Object.entries(D.categories))add(id,name);
 for(const id of ['search','scope','direction'])$('#'+id).addEventListener(id==='search'?'input':'change',refresh);
 $('#overview').onclick=()=>{overview=!overview;document.body.classList.toggle('overview',overview);$('#overview').setAttribute('aria-pressed',String(overview));$('#overview').textContent=overview?'카드 보기로 돌아가기':'전체 펼쳐보기';if(overview){category='';$('#scope').value='all';$('#search').value='';$('#direction').value=''}refresh()};
 $('#background').onclick=()=>{const on=document.body.classList.toggle('dark-check');$('#background').setAttribute('aria-pressed',String(on))};$('#more').onclick=more;$('#close').onclick=()=>$('#detail').close();$('#copy').onclick=()=>copy(selected.path,'#dialog-status');$('#repeat').onclick=()=>{const on=$('#large').classList.toggle('repeat');$('#repeat').setAttribute('aria-pressed',String(on));$('#large').style.backgroundImage=on?`url("${url(selected.path)}")`:''};
 $('#export-list').onclick=()=>{const blob=new Blob([JSON.stringify({assets:filtered},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spirit-war-assets.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};refresh();
}
function refresh(){const terms=$('#search').value.toLowerCase().trim().split(/\s+/).filter(Boolean),scope=$('#scope').value,dir=$('#direction').value;
 filtered=D.assets.filter(a=>(scope!=='recent'||a.recent)&&(!category||a.category===category)&&(!dir||a.direction===dir)&&terms.every(t=>(a.path+' '+a.name+' '+(D.factions[a.faction]||'')+' '+a.direction_name+' '+D.categories[a.category]+' '+a.note).toLowerCase().includes(t)));
 shown=0;$('#grid').replaceChildren();$('#count').textContent=`${filtered.length.toLocaleString()}개 그림`;
 for(const b of $('#categories').children)b.setAttribute('aria-pressed',String(b.dataset.category===category));
 if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='조건에 맞는 그림이 없습니다. 묶음이나 검색어를 바꿔 보세요.';$('#grid').append(p)}more();
}
function more(){const next=filtered.slice(shown,overview?filtered.length:shown+48),fragment=document.createDocumentFragment();for(const a of next){const card=document.createElement('article');card.className='card';card.title=a.path;const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label',a.name+' 상세 보기');preview.onclick=()=>open(a);const im=document.createElement('img');im.src=url(a.path);im.alt=a.name;im.loading='lazy';im.decoding='async';if(a.pixel)im.className='pixel';preview.append(im);card.append(preview);
 const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=a.name;info.append(title);const path=document.createElement('div');path.className='path';path.textContent=overview?a.path.split('/').pop():a.path;info.append(path);const meta=document.createElement('div');meta.className='meta';meta.textContent=`${a.width}×${a.height} · ${a.transparent?'투명':'불투명'} · ${a.format}`;info.append(meta);
 const tags=document.createElement('div');tags.className='tags';for(const t of [a.direction_name,a.frame?'걷기 '+a.frame+'/4':'',a.layout?'4변형 시트':'',D.factions[a.faction]||'']){if(!t)continue;const s=document.createElement('span');s.className='tag';s.textContent=t;tags.append(s)}info.append(tags);
 const actions=document.createElement('div');actions.className='actions';const get=document.createElement('a');get.href=url(a.path);get.download=a.path.split('/').pop();get.textContent='파일 받기';const cp=document.createElement('button');cp.textContent='경로 복사';cp.onclick=()=>copy(a.path,'#status');actions.append(get,cp);info.append(actions);card.append(info);fragment.append(card)}$('#grid').append(fragment);shown+=next.length;$('#more').hidden=shown>=filtered.length;$('#more').textContent=`더 보기 (${shown}/${filtered.length})`;
}
async function copy(value,target){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;const parent=$('#detail').open?$('#detail'):document.body;parent.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy')}$(target).textContent='복사했어요 · '+value}catch(e){$(target).textContent='아래 파일 경로를 선택해서 복사하세요: '+value}}
function open(a){selected=a;$('#detail-title').textContent=a.name;$('#detail-category').textContent=D.categories[a.category];$('#large').classList.remove('repeat');$('#large').style.backgroundImage='';$('#large-image').src=url(a.path);$('#large-image').alt=a.name;$('#large-image').className=a.pixel?'pixel':'';$('#repeat').hidden=!(a.category==='hd'&&!a.transparent&&!a.layout);$('#repeat').setAttribute('aria-pressed','false');$('#dialog-status').textContent='';$('#details').replaceChildren();
 const fields={'파일 경로':a.path,'크기':`${a.width} × ${a.height}`,'형식·배경':`${a.format} · ${a.transparent?'투명 배경':'불투명'}`,'파일 용량':size(a.bytes)};if(a.direction_name)fields['방향']=a.direction_name;if(a.frame)fields['동작']=`걷기 ${a.frame}/4`;if(a.layout)fields['시트 분할']=`${a.layout.columns}칸 × ${a.layout.rows}줄, 각 ${a.layout.cell_width}×${a.layout.cell_height}, 밑끝 y=${a.layout.base_y_exclusive}`;if(a.transparent&&a.alpha_bbox)fields['알파 범위']=a.alpha_bbox.join(', ')+' (오른쪽·아래 exclusive)';fields['SHA-256']=a.sha256;
 for(const[k,v]of Object.entries(fields)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;$('#details').append(dt,dd)}$('#note').textContent=a.note;$('#download').href=url(a.path);$('#download').download=a.path.split('/').pop();$('#doc').href=url(a.doc);$('#detail').showModal();
}
</script>
</html>
